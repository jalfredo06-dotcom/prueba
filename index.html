<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a2f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Libreta de campo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="top">
  <button id="nbBtn" class="title" aria-label="Libretas y exportación"><span id="nbName">Libreta</span> <span aria-hidden="true">▾</span></button>
  <button id="gpsChip" class="gps" aria-label="Ubicación actual"><i class="dot"></i><span id="gpsText">Buscando GPS…</span></button>
</header>
<div id="tagFilter" class="chips filter" hidden></div>
<main id="list" aria-live="polite"></main>
<nav id="bar">
  <button id="btnPhoto" class="primary"><b>📷</b>Foto</button>
  <button id="btnGallery"><b>🖼️</b>Galería</button>
  <button id="btnBoard"><b>🧾</b>Pizarra</button>
</nav>
<input id="camIn" type="file" accept="image/*" capture="environment" hidden>
<input id="galIn" type="file" accept="image/*" hidden>
<input id="impIn" type="file" accept=".zip,application/zip" hidden>
<div id="toast" role="status"></div>
<script src="js/geo.js"></script>
<script src="js/zip.js"></script>
<script src="js/pdf.js"></script>
<script src="js/db.js"></script>
<script src="js/render.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>
</body>
</html>
