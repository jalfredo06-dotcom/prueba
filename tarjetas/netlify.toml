# Sitio estático: no necesita compilación.
# En Netlify basta con poner "Base directory" = tarjetas; el resto lo toma de aquí.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Siempre revisar si hay una versión nueva (evita que el navegador use código viejo tras actualizar).
    Cache-Control = "public, max-age=0, must-revalidate"
